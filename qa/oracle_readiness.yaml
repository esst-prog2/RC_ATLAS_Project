rules:
  - APPROVED_EXISTING requires a cited repository specification, test, documented business rule, or independent reference.
  - APPROVED_OWNER requires a stable decision ID and the project owner's explicit approval.
  - UNDEFINED scenarios remain non-executable until their oracle-definition requirement is resolved.
  - Observed implementation output never establishes an oracle.
decisions:
  QA-001:
    scenario_ids: [FUN-NOTIFY-001]
    approved_on: 2026-10-09
    statement: Acknowledging a notification must not mutate underlying business state.
  QA-002:
    scenario_ids: [INT-FAIL-001]
    approved_on: 2026-10-09
    statement: External provider failures must preserve committed business operations. Retry and duplicate prevention must be supported where technically possible; exactly-once delivery is not claimed without provider guarantees.
  QA-003:
    scenario_ids: [REL-CALC-001]
    approved_on: 2026-10-09
    statement: Identical canonical inputs, filters, parameters, and calculation rules must produce reproducible analytics.
  QA-004:
    scenario_ids: [UI-A11Y-001]
    approved_on: 2026-10-09
    statement: WCAG 2.2 AA is the accessibility evaluation target, not a claim of compliance.
  QA-005:
    scenario_ids: [UI-RESP-001]
    approved_on: 2026-10-09
    statement: Evaluate responsive layouts at 360x800, 768x1024, 1366x768, and 1920x1080.
  QA-006:
    scenario_ids: [UI-PROJ-001]
    approved_on: 2026-10-09
    statement: Project forms must provide actionable validation, prevent accidental duplicate submissions, confirm saves, and preserve values after reload.
